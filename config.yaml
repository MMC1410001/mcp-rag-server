# Central configuration for the RAG pipeline.
# Every value here matches the previous hard-coded default, so behaviour is
# unchanged if this file is edited back or removed.

chunking:
  chunk_size: 500      # words per chunk
  overlap: 50          # words shared between neighbouring chunks

embeddings:
  model: all-MiniLM-L6-v2   # sentence-transformers, ~80MB, 384 dims
  dimension: 384

vectordb:
  path: chroma_db           # relative to the project root
  collection: rag_documents
  distance: cosine

retrieval:
  n_results: 5              # chunks returned by a search
  n_context_chunks: 5       # chunks fed to the LLM for ask_question

llm:
  model: claude-sonnet-4-6
  max_tokens: 1024

logging:
  level: INFO
  file: logs/app.log
